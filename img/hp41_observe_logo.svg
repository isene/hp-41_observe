<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with night sky -->
  <rect x="0" y="0" width="200" height="200" fill="#000814"/>
  
  <!-- Stars -->
  <g fill="#fff" opacity="0.9">
    <circle cx="25" cy="20" r="1"/>
    <circle cx="180" cy="30" r="0.5"/>
    <circle cx="170" cy="60" r="1.5"/>
    <circle cx="30" cy="80" r="0.5"/>
    <circle cx="190" cy="90" r="1"/>
    <circle cx="15" cy="120" r="0.8"/>
    <circle cx="175" cy="140" r="1.2"/>
    <circle cx="40" cy="170" r="0.5"/>
    <circle cx="160" cy="180" r="1"/>
  </g>
  
  <!-- HP-41 Calculator controlling telescope -->
  <g transform="translate(70, 110)">
    <!-- Calculator body -->
    <rect x="-35" y="-40" width="70" height="100" rx="6" fill="#2c2c2c" stroke="#444" stroke-width="2"/>
    
    <!-- LCD Display -->
    <rect x="-30" y="-32" width="60" height="16" rx="2" fill="#0a4d0a" stroke="#333" stroke-width="1"/>
    <text x="0" y="-22" font-family="monospace" font-size="7" fill="#00ff00" text-anchor="middle">M31 ANDROMEDA</text>
    
    <!-- Observation list display -->
    <rect x="-28" y="-12" width="56" height="28" fill="#1a1a1a" stroke="#333" stroke-width="1" rx="2"/>
    
    <!-- Object list -->
    <g font-family="monospace" font-size="4" fill="#00ff00">
      <text x="-25" y="-6">RA: 00h 42m 44s</text>
      <text x="-25" y="0">DEC: +41° 16' 09"</text>
      <text x="-25" y="6">Mag: 3.4</text>
      <text x="-25" y="12">Type: Galaxy</text>
    </g>
    
    <!-- USB41 indicator -->
    <rect x="-28" y="18" width="56" height="10" fill="#1e40af" stroke="#333" stroke-width="1" rx="1">
      <animate attributeName="fill" values="#1e40af;#3b82f6;#1e40af" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="25" font-family="monospace" font-size="5" fill="#fff" text-anchor="middle">USB41 → INDI</text>
    
    <!-- Keyboard -->
    <g fill="#1a1a1a" stroke="#666" stroke-width="0.5">
      <rect x="-25" y="32" width="10" height="6" rx="1"/>
      <rect x="-12" y="32" width="10" height="6" rx="1"/>
      <rect x="1" y="32" width="10" height="6" rx="1"/>
      <rect x="14" y="32" width="10" height="6" rx="1"/>
    </g>
    
    <!-- Key labels -->
    <g font-family="monospace" font-size="3" fill="#fff" text-anchor="middle">
      <text x="-20" y="36">GOTO</text>
      <text x="-7" y="36">NEXT</text>
      <text x="6" y="36">PREV</text>
      <text x="19" y="36">LIST</text>
    </g>
  </g>
  
  <!-- Telescope -->
  <g transform="translate(140, 120)">
    <!-- Mount base -->
    <rect x="-5" y="30" width="10" height="15" fill="#444" stroke="#666" stroke-width="1"/>
    <rect x="-8" y="45" width="16" height="5" fill="#333" stroke="#555" stroke-width="1"/>
    
    <!-- Mount arm -->
    <line x1="0" y1="30" x2="0" y2="10" stroke="#666" stroke-width="3"/>
    
    <!-- Telescope tube with rotation animation -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 0 10;-20 0 10;0 0 10" dur="5s" repeatCount="indefinite"/>
      <rect x="-4" y="-20" width="8" height="50" fill="#1e293b" stroke="#334155" stroke-width="2" rx="2" transform="rotate(-30 0 10)"/>
      <!-- Eyepiece -->
      <rect x="8" y="5" width="5" height="10" fill="#475569" stroke="#64748b" stroke-width="1" transform="rotate(-30 0 10)"/>
      <!-- Objective lens -->
      <circle cx="15" cy="-25" r="6" fill="#3b82f6" stroke="#60a5fa" stroke-width="1" opacity="0.8" transform="rotate(-30 0 10)"/>
    </g>
    
    <!-- Tracking indicator -->
    <circle cx="0" cy="10" r="15" fill="none" stroke="#22c55e" stroke-width="1" stroke-dasharray="2,3" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" values="0 0 10;360 0 10" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Data flow visualization -->
  <g opacity="0.8">
    <!-- HP-41 to PC -->
    <path d="M 80,130 Q 90,125 100,125" stroke="#60a5fa" stroke-width="2" fill="none" stroke-dasharray="4,2">
      <animate attributeName="stroke-dashoffset" values="0;-6" dur="1s" repeatCount="indefinite"/>
    </path>
    <text x="90" y="120" font-family="monospace" font-size="4" fill="#60a5fa" text-anchor="middle">USB41</text>
    
    <!-- PC to Mount -->
    <path d="M 115,125 Q 125,125 135,130" stroke="#60a5fa" stroke-width="2" fill="none" stroke-dasharray="4,2">
      <animate attributeName="stroke-dashoffset" values="0;-6" dur="1s" repeatCount="indefinite"/>
    </path>
    <text x="125" y="120" font-family="monospace" font-size="4" fill="#60a5fa" text-anchor="middle">INDI</text>
  </g>
  
  <!-- PC/Linux indicator -->
  <g transform="translate(105, 125)">
    <rect x="-8" y="-8" width="16" height="12" fill="#374151" stroke="#6b7280" stroke-width="1" rx="1"/>
    <rect x="-6" y="-6" width="12" height="8" fill="#1f2937"/>
    <text x="0" y="0" font-family="monospace" font-size="3" fill="#60a5fa" text-anchor="middle">LINUX</text>
    <rect x="-3" y="4" width="6" height="2" fill="#6b7280"/>
  </g>
  
  <!-- Deep sky object being observed -->
  <g transform="translate(170, 40)" opacity="0.8">
    <!-- M31 Andromeda Galaxy -->
    <ellipse cx="0" cy="0" rx="20" ry="8" fill="#4a5568" opacity="0.4" transform="rotate(-20)">
      <animate attributeName="opacity" values="0.4;0.6;0.4" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="12" ry="5" fill="#6b7280" opacity="0.6" transform="rotate(-20)"/>
    <ellipse cx="0" cy="0" rx="5" ry="2" fill="#9ca3af" opacity="0.8" transform="rotate(-20)"/>
    
    <text x="0" y="20" font-family="monospace" font-size="5" fill="#fff" text-anchor="middle">M31</text>
  </g>
  
  <!-- Observation list files -->
  <g transform="translate(30, 50)" opacity="0.7">
    <text x="0" y="0" font-family="monospace" font-size="6" fill="#fff">Lists:</text>
    
    <rect x="0" y="5" width="30" height="8" fill="#22c55e" stroke="#16a34a" stroke-width="1" rx="1"/>
    <text x="15" y="10" font-family="monospace" font-size="4" fill="#fff" text-anchor="middle">*OBS1</text>
    
    <rect x="0" y="15" width="30" height="8" fill="#3b82f6" stroke="#2563eb" stroke-width="1" rx="1"/>
    <text x="15" y="20" font-family="monospace" font-size="4" fill="#fff" text-anchor="middle">*MESS</text>
    
    <rect x="0" y="25" width="30" height="8" fill="#8b5cf6" stroke="#7c3aed" stroke-width="1" rx="1"/>
    <text x="15" y="30" font-family="monospace" font-size="4" fill="#fff" text-anchor="middle">*NGC</text>
  </g>
  
  <!-- KStars/Stellarium indicator -->
  <g transform="translate(30, 160)" opacity="0.6">
    <rect x="0" y="0" width="40" height="20" fill="#1e293b" stroke="#334155" stroke-width="1" rx="2"/>
    <text x="20" y="8" font-family="monospace" font-size="4" fill="#60a5fa" text-anchor="middle">KStars</text>
    <text x="20" y="15" font-family="monospace" font-size="3" fill="#60a5fa" text-anchor="middle">Stellarium</text>
  </g>
  
  <!-- Text -->
  <text x="100" y="185" font-family="monospace" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">HP-41 Observe</text>
  <text x="100" y="197" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Telescope Control System</text>
</svg>